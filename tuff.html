          <div>
            <span class="spot-building-tag">${escapeHtml(food.icon)} ${escapeHtml(food.name)}</span>
            <div class="spot-shop-name">${escapeHtml(spot.shopName)}</div>
            ${spot.note ? `<div class="spot-note">${escapeHtml(spot.note)}</div>` : ''}
          </div>
          <div class="spot-price">${formatPrice(spot.price)}</div>
        `;
        header.addEventListener('click', () => selectFood(food.id));
        card.appendChild(header);

        const metaRow = document.createElement('div');
        metaRow.className = 'spot-meta-row';
        metaRow.innerHTML = `
          <span>🕒 ${escapeHtml(spot.openHours)} ·
            <span class="status-badge ${openInfo.isOpen ? 'status-open' : 'status-closed'}">${openInfo.label}</span>
          </span>
          <span style="display:inline-flex; align-items:center; gap:5px; color:#f8fafc;">
            ${rating.count > 0
              ? `${renderHalfStarsHTML(rating.average)} <strong>${rating.average.toFixed(1)}</strong> <span style="color:#94a3b8;">(${rating.count})</span>`
              : `<span style="color:#94a3b8;">Chưa có đánh giá</span>`
            }
          </span>
        `;
        card.appendChild(metaRow);

        const ownerControls = createOwnerControls(spot);
        if (ownerControls) card.appendChild(ownerControls);
        card.appendChild(createSpotRatingSection(spot, refreshCurrentView));
        panelBody.appendChild(card);
      });
    }

    function clearAllSelections() {
      reviewUIState.clear();
      closeMobileReviewsSheet();
      state.selectedFoodId = null;
      resetHighlight();
      renderFoodList();
    }

    function updateAuthButton() {
      const button = document.getElementById('btn-auth');
      if (!button) return;
      const user = shopService.getCurrentUser();
      button.textContent = user ? `Đăng xuất (${user.email || 'đã đăng nhập'})` : 'Đăng nhập chủ quán';
    }

    function openAuthModal() {
      const user = shopService.getCurrentUser();
      if (user) {
        showDeleteConfirmModal(async () => {
          await supabase.auth.signOut();
          showNoticeToast('Đã đăng xuất');
        }, 'Đăng xuất khỏi tài khoản chủ quán?');
        return;
      }

      const backdrop = document.createElement('div');
      backdrop.className = 'confirm-modal-backdrop';
      backdrop.innerHTML = `
        <form class="confirm-modal">
          <h3>Đăng nhập chủ quán</h3>
          <p>Supabase sẽ gửi liên kết đăng nhập một lần đến email của bạn.</p>
          <label class="shop-label">Email
            <input name="email" type="email" autocomplete="email" required placeholder="ban@example.com">
          </label>
          <div class="shop-error hidden" role="alert"></div>
          <div class="confirm-modal-actions">
            <button type="button" class="btn" data-act="cancel">Hủy</button>
            <button type="submit" class="btn btn-primary">Gửi liên kết</button>
          </div>
        </form>`;
      const close = () => backdrop.remove();
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('[data-act="cancel"]').addEventListener('click', close);
      backdrop.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        const errorEl = form.querySelector('.shop-error');
        const email = new FormData(form).get('email');
        const { error } = await supabase.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: window.location.href }
        });
        if (error) {
          errorEl.textContent = error.message;
          errorEl.classList.remove('hidden');
          return;
        }
        close();
        showNoticeToast('Đã gửi liên kết đăng nhập đến email');
      });
      document.body.appendChild(backdrop);
      backdrop.querySelector('[name="email"]').focus();
    }

    function openShopForm() {
      const clusters = [...new Set(BUILDINGS_DATA.map((b) => b.cluster))];
      const backdrop = document.createElement('div');
      backdrop.className = 'confirm-modal-backdrop';
      backdrop.innerHTML = `
        <form class="confirm-modal shop-modal" novalidate>
          <h3>Thêm món / quán của bạn</h3>
          <p>Quán công khai trên Supabase. Hãy đăng nhập trước; quán và menu thuộc tài khoản chủ quán.</p>
          <label class="shop-label">Tên món
            <input name="foodName" list="shop-food-names" maxlength="40" placeholder="VD: Cơm tấm (chọn món có sẵn hoặc gõ món mới)">
          </label>
          <datalist id="shop-food-names">${FOODS_DATA.foods.map((f) => `<option value="${escapeHtml(f.name)}">`).join('')}</datalist>
          <div class="shop-row">
            <label class="shop-label">Danh mục (món mới)
              <select name="category">${SHOP_CATEGORIES.map((category) => `<option>${escapeHtml(category)}</option>`).join('')}</select>
            </label>
            <label class="shop-label">Biểu tượng
              <select name="icon">${SHOP_ICONS.map((icon) => `<option>${icon}</option>`).join('')}</select>
            </label>
          </div>
          <label class="shop-label">Tên quán <input name="shopName" maxlength="40" placeholder="VD: Cơm tấm cô Ba"></label>
          <label class="shop-label">Giá (đồng) <input name="price" type="number" inputmode="numeric" min="1000" step="500" placeholder="25000"></label>
          <div class="shop-label">Bán ở tòa nào (chọn một hoặc nhiều)
            ${clusters.map((cluster) => `
              <div class="bld-cluster"><span>${escapeHtml(cluster)}</span><div class="bld-chips">
                ${BUILDINGS_DATA.filter((b) => b.cluster === cluster).map((building) =>
                  `<label class="bld-chip"><input type="checkbox" name="building" value="${escapeHtml(building.id)}"><span>${escapeHtml(building.id)}</span></label>`).join('')}
              </div></div>`).join('')}
          </div>
          <div class="shop-label">Giờ hoạt động
            <div class="shop-row"><input type="time" name="open" value="07:00" aria-label="Giờ mở cửa"><input type="time" name="close" value="21:00" aria-label="Giờ đóng cửa"></div>
            <label class="shop-check"><input type="checkbox" name="allday"> Mở cả ngày</label>
          </div>
          <label class="shop-label">Ghi chú (tùy chọn) <input name="note" maxlength="80" placeholder="VD: Gần sảnh"></label>
          <label class="shop-label">Ảnh menu (JPG, PNG, WebP; tối đa 5 ảnh, 5 MB/ảnh)
            <input class="menu-photo-input" name="menuPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
          </label>
          <div class="shop-error hidden" role="alert"></div>
          <div class="confirm-modal-actions">
            <button type="button" class="btn" data-act="cancel">Hủy</button>
            <button type="submit" class="btn btn-primary">Đăng quán</button>
          </div>
        </form>`;

      const onKey = (e) => { if (e.key === 'Escape') close(); };
      function close() {
        document.removeEventListener('keydown', onKey);
        backdrop.remove();
      }

      document.addEventListener('keydown', onKey);
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('[data-act="cancel"]').addEventListener('click', close);

      const form = backdrop.querySelector('form');
      const errorEl = backdrop.querySelector('.shop-error');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';
        errorEl.classList.add('hidden');
        const formData = new FormData(form);
        const submitButton = form.querySelector('[type="submit"]');
        submitButton.disabled = true;
        submitButton.textContent = 'Đang đăng...';
        const result = await shopService.addShop({
          foodName: formData.get('foodName'),
          category: formData.get('category'),
          icon: formData.get('icon'),
          shopName: formData.get('shopName'),
          price: formData.get('price'),
          note: formData.get('note'),
          files: formData.getAll('menuPhotos').filter((file) => file && file.size > 0),
          buildingIds: formData.getAll('building'),
          openHours: formData.get('allday') === 'on'
            ? '00:00-23:59'
            : `${formData.get('open')}-${formData.get('close')}`
        });
        submitButton.disabled = false;
        submitButton.textContent = 'Đăng quán';
        if (!result.ok) {
          errorEl.textContent = result.error;
          errorEl.classList.remove('hidden');
          return;
        }

        close();
        state.selectedCategory = 'Tất cả';
        renderCategoryFilters();
        selectFood(result.foodId, result.buildingId);
        showNoticeToast('Đã đăng quán công khai');
      });

      document.body.appendChild(backdrop);
      backdrop.querySelector('[name="foodName"]').focus();
    }

    function createOwnerControls(spot) {
      if (!spot.custom) return null;
      const wrap = document.createElement('div');
      wrap.className = 'owner-row';
      const tag = document.createElement('span');
      tag.className = 'owner-tag';
      tag.textContent = 'Quán tự đăng · chưa xác minh';
      wrap.appendChild(tag);
      if (shopService.getCurrentUser() && spot.ownerId === shopService.getCurrentUser().id) {
        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'btn-review-delete';
        deleteButton.innerHTML = '🗑️ <span>Xóa quán này</span>';
        deleteButton.addEventListener('click', () => showDeleteConfirmModal(async () => {
          const result = await shopService.removeShop(spot.id);
          if (!result.ok) {
            showNoticeToast(result.error || 'Không thể xóa lúc này');
            return;
          }
          state.selectedCategory = 'Tất cả';
          renderCategoryFilters();
          clearAllSelections();
          showNoticeToast('Đã xóa quán');
        }, 'Bạn có chắc muốn xóa quán này khỏi danh sách?'));
        wrap.appendChild(deleteButton);
      }
      return wrap;
    }

    /* =========================================================================
       10. TƯƠNG TÁC 3D & MOBILE BOTTOM SHEET
    ========================================================================= */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDownPos = null;
    let isHighDetail = true;

    function updatePointerCoords(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickBuilding() {
      return raycaster.intersectObjects(buildingHitTargets, false).filter((h) => {
        for (let o = h.object; o; o = o.parent) if (!o.visible) return false;
        return true;
      });
    }

    function handleHover(event) {
      if (event.pointerType === 'touch') return;
      updatePointerCoords(event.clientX, event.clientY);
      raycaster.setFromCamera(pointer, camera);
      const hits = pickBuilding();
      const nextId = hits.length > 0 ? hits[0].object.userData.buildingGroup.userData.building.id : null;

      if (nextId !== state.hoveredBuildingId) {
        state.hoveredBuildingId = nextId;
        renderer.domElement.style.cursor = nextId ? 'pointer' : 'grab';
        applyBuildingVisuals();
      }
    }

    function handlePointerDown(event) {
      pointerDownPos = { x: event.clientX, y: event.clientY };
    }

    function handlePointerUp(event) {
      if (!pointerDownPos) return;
      const movedDist = Math.hypot(event.clientX - pointerDownPos.x, event.clientY - pointerDownPos.y);
      pointerDownPos = null;
      if (movedDist > 6) return;

      updatePointerCoords(event.clientX, event.clientY);
      raycaster.setFromCamera(pointer, camera);
      const hits = pickBuilding();

      if (hits.length > 0) {
        const buildingId = hits[0].object.userData.buildingGroup.userData.building.id;
        reviewUIState.clear();
        closeMobileReviewsSheet();
        flyToBuilding(buildingId);
        renderBuildingFoods(buildingId);
        expandMobileSheetIfPeek();
      }
    }

    function toggleHighDetail() {
      isHighDetail = !isHighDetail;
      const btn = document.getElementById('btn-toggle-detail');
      btn.textContent = isHighDetail ? 'Chi tiết cao: BẬT' : 'Chi tiết cao: TẮT';
      btn.classList.toggle('active', isHighDetail);

      renderer.setPixelRatio(isHighDetail ? Math.min(window.devicePixelRatio, 2) : 1);
      renderer.shadowMap.enabled = isHighDetail;
      sunLight.castShadow = isHighDetail;

      highDetailObjects.forEach((obj) => { obj.visible = isHighDetail; });
      instancedRefs.forEach(({ mesh, fullCount, reducedCount }) => {
        mesh.count = isHighDetail ? fullCount : reducedCount;
      });
    }

    const foodPanel = document.getElementById('food-panel');
    const sheetHandle = document.getElementById('sheet-handle');

    function expandMobileSheetIfPeek() {
      if (window.innerWidth <= 767) {
        const currentH = foodPanel.getBoundingClientRect().height;
        if (currentH < window.innerHeight * 0.35) {
          foodPanel.style.height = '54vh';
        }
      }
    }

    function setupMobileBottomSheet() {
      let startY = 0;
      let startH = 0;
      let dragging = false;

      sheetHandle.addEventListener('pointerdown', (e) => {
        if (window.innerWidth > 767) return;
        dragging = true;
        startY = e.clientY;
        startH = foodPanel.getBoundingClientRect().height;
        foodPanel.classList.add('dragging');
        sheetHandle.setPointerCapture(e.pointerId);
      });

      sheetHandle.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const delta = startY - e.clientY;
        const nextH = Math.max(135, Math.min(window.innerHeight * 0.86, startH + delta));
        foodPanel.style.height = `${nextH}px`;
        updateRendererSize();
      });

      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        foodPanel.classList.remove('dragging');
        const h = foodPanel.getBoundingClientRect().height;
        const vh = window.innerHeight;
        if (Math.abs(startY - e.clientY) < 6) {
          foodPanel.style.height = h < vh * 0.35 ? '54vh' : (h < vh * 0.68 ? '82vh' : '150px');
        } else if (h < vh * 0.28) {
          foodPanel.style.height = '150px';
        } else if (h < vh * 0.68) {
          foodPanel.style.height = '54vh';
        } else {
          foodPanel.style.height = '82vh';
        }
      };

      sheetHandle.addEventListener('pointerup', endDrag);
      sheetHandle.addEventListener('pointercancel', endDrag);
      foodPanel.addEventListener('transitionend', updateRendererSize);
    }

    function setupInteractions() {
      const dom = renderer.domElement;
      dom.style.cursor = 'grab';
      dom.addEventListener('pointermove', handleHover);
      dom.addEventListener('pointerdown', handlePointerDown);
      dom.addEventListener('pointerup', handlePointerUp);

      controls.addEventListener('start', () => { cameraTween = null; });

      searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        if (state.viewMode === 'list') renderFoodList();
      });

      btnClearSelection.addEventListener('click', clearAllSelections);

      document.getElementById('btn-reset-camera').addEventListener('click', () => {
        startCameraTween(DEFAULT_CAMERA_POS, DEFAULT_TARGET, 850);
      });

      // Bay thẳng ra trước Cổng KTX ở lối vào phía Đông (x = +106, z = 0)
      document.getElementById('btn-gate-view').addEventListener('click', () => {
        startCameraTween(new THREE.Vector3(136, 12, 16), new THREE.Vector3(106, 4, 0), 900);
      });

      document.getElementById('btn-toggle-detail').addEventListener('click', toggleHighDetail);
      setupMobileBottomSheet();
    }

    /* =========================================================================
       11. KHỞI CHẠY TOÀN BỘ ỨNG DỤNG
    ========================================================================= */
    createSkyAndClouds();
    createCampusGround();
    createGate();

    BUILDINGS_DATA.forEach((building) => {
      const group = createBuildingMesh(building);
      createBuildingLabel(building, group);
    });

    createTree();
    createBench();
    createLamp();
    createBike();
    createFlowerBeds();

    renderCategoryFilters();
    renderFoodList();
    setupInteractions();
    if (matchMedia('(pointer: coarse)').matches) toggleHighDetail();
    updateRendererSize();

    const resizeObserver = new ResizeObserver(updateRendererSize);
    resizeObserver.observe(container);
    window.addEventListener('resize', updateRendererSize);

    function animate() {
      requestAnimationFrame(animate);

      if (cameraTween) {
        const elapsed = performance.now() - cameraTween.startTime;
        const progress = Math.min(1, elapsed / cameraTween.duration);
        const eased = easeInOutCubic(progress);
        camera.position.lerpVectors(cameraTween.fromPos, cameraTween.toPos, eased);
        controls.target.lerpVectors(cameraTween.fromTarget, cameraTween.toTarget, eased);
        if (progress >= 1) cameraTween = null;
      }

      if (isHighDetail) {
        cloudGroup.position.x = Math.sin(performance.now() * 0.00008) * 18;
      }

      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    animate();

    window.addEventListener('storage', (e) => {
      if (e.key === 'ktx_khub_ratings_v1') refreshCurrentView();
    });

    document.getElementById('btn-add-shop').addEventListener('click', openShopForm);
    document.getElementById('btn-auth').addEventListener('click', openAuthModal);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.getElementById('btn-cancel-delete').click();
        closeMobileReviewsSheet();
      }
    });
  </script>
</body>
</html>
